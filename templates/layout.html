<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — Житомир</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f0; color: #333; line-height: 1.7; }
        header { background: linear-gradient(135deg, #1a5276, #2e86c1); color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 24px 20px 16px; }
        header h1 { font-size: 2.2rem; letter-spacing: 1px; text-shadow: 1px 1px 4px rgba(0,0,0,.4); }
        header p.subtitle { font-size: 0.95rem; opacity: .85; margin-top: 4px; }
        nav { background: #154360; }
        nav ul { max-width: 1100px; margin: 0 auto; list-style: none; display: flex; flex-wrap: wrap; }
        nav ul li a { display: block; color: #d6eaf8; text-decoration: none; padding: 13px 22px; font-size: 0.95rem; transition: background .2s; }
        nav ul li a:hover, nav ul li a.active { background: #2e86c1; color: #fff; }
        main { max-width: 1100px; margin: 36px auto; padding: 0 20px 40px; }
        .page-hero { background: linear-gradient(135deg, #2e86c1, #1a5276); color: #fff; border-radius: 12px; padding: 40px; margin-bottom: 36px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
        .page-hero h2 { font-size: 2rem; margin-bottom: 10px; }
        .page-hero p { font-size: 1.05rem; opacity: .9; max-width: 700px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-top: 28px; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.09); overflow: hidden; transition: transform .2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,.15); }
        .card-header { background: #2e86c1; color: #fff; padding: 14px 20px; font-size: 1.1rem; font-weight: bold; }
        .card-header.green { background: #1e8449; }
        .card-header.orange { background: #d35400; }
        .card-header.purple { background: #7d3c98; }
        .card-header.teal { background: #148f77; }
        .card-body { padding: 18px 20px; font-size: 0.95rem; }
        .card-body ul { padding-left: 18px; }
        .card-body ul li { margin-bottom: 6px; }
        .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-top: 24px; }
        .data-table thead { background: #1a5276; color: #fff; }
        .data-table th, .data-table td { padding: 12px 18px; text-align: left; border-bottom: 1px solid #eaecee; }
        .data-table tbody tr:hover { background: #eaf4fb; }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 28px; }
        .fact-box { background: #fff; border-left: 5px solid #2e86c1; border-radius: 8px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .fact-box .fact-num { font-size: 2rem; font-weight: bold; color: #2e86c1; }
        .fact-box .fact-label { font-size: 0.9rem; color: #666; margin-top: 4px; }
        .contact-form { background: #fff; border-radius: 10px; padding: 32px 36px; box-shadow: 0 2px 12px rgba(0,0,0,.09); max-width: 600px; }
        .contact-form label { display: block; font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 5px; margin-top: 18px; }
        .contact-form label:first-of-type { margin-top: 0; }
        .contact-form input[type=text], .contact-form input[type=email], .contact-form textarea { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; font-family: inherit; transition: border-color .2s; }
        .contact-form input:focus, .contact-form textarea:focus { outline: none; border-color: #2e86c1; }
        .contact-form textarea { resize: vertical; min-height: 120px; }
        .btn-submit { margin-top: 20px; background: #2e86c1; color: #fff; border: none; border-radius: 7px; padding: 11px 28px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #1a5276; }
        .success-msg { background: #d5f5e3; border: 1px solid #27ae60; color: #1e8449; border-radius: 7px; padding: 14px 20px; margin-top: 20px; font-weight: 600; }
        .error-msg { background: #fadbd8; border: 1px solid #e74c3c; color: #c0392b; border-radius: 7px; padding: 14px 20px; margin-top: 20px; }
        .section-title { font-size: 1.5rem; color: #1a5276; border-bottom: 3px solid #2e86c1; padding-bottom: 8px; margin-bottom: 20px; margin-top: 36px; }
        .section-title:first-of-type { margin-top: 0; }
        footer { background: #154360; color: #aed6f1; text-align: center; padding: 20px; font-size: 0.9rem; margin-top: 40px; }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <h1>🏙️ Місто Житомир</h1>
        <p class="subtitle">Перлина Полісся · Засноване у 884 році</p>
    </div>
</header>
<nav>
    <ul>
        <li><a href="/" {{ if eq .Page "home" }}class="active"{{ end }}>🏠 Головна</a></li>
        <li><a href="/history" {{ if eq .Page "history" }}class="active"{{ end }}>📜 Історія</a></li>
        <li><a href="/attractions" {{ if eq .Page "attractions" }}class="active"{{ end }}>🏛️ Пам'ятки</a></li>
        <li><a href="/facts" {{ if eq .Page "facts" }}class="active"{{ end }}>📊 Факти</a></li>
        <li><a href="/contact" {{ if eq .Page "contact" }}class="active"{{ end }}>✉️ Контакти</a></li>
    </ul>
</nav>
<main>
    {{ template "content" . }}
</main>
<footer>
    <p>© 2025 Сайт про Житомир · Лабораторна робота №7 · Go net/http + html/template</p>
</footer>
</body>
</html>
